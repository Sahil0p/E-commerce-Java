<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="/" class="brand">E-Commerce</a>
            <a href="/cart" class="cart-link">
                Cart <span class="cart-badge" th:text="${cartSize}">0</span>
            </a>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Featured Products</h1>
            <p>Discover our minimal collection.</p>
        </header>

        <div class="product-grid">
            <div th:each="product : ${products}" class="product-card">
                <div class="product-image">
                    <img th:src="${product.imageUrl}" th:alt="${product.name}">
                </div>
                <div class="product-info">
                    <h2 th:text="${product.name}">Product Name</h2>
                    <p class="description" th:text="${product.description}">Product description</p>
                    <div class="product-footer">
                        <span class="price" th:text=" '$' + ${product.price}">$0.00</span>
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <button type="submit" class="btn btn-primary">Add to Cart</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 E-Commerce Demo.</p>
    </footer>
</body>
</html>
